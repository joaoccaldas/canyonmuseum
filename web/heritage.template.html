<script>
/* Same Desktop-view fit as the modern studio: phone layout, UI scaled up, canvas left alone. */
(function fit() {
  var html = document.documentElement;
  function apply() {
    var short = Math.min(screen.width, screen.height);
    var touch = matchMedia('(pointer: coarse)').matches;
    var landscape = innerWidth > innerHeight;
    var ratio = innerWidth / (landscape ? Math.max(screen.width, screen.height) : short);
    var on = touch && short < 600 && ratio > 1.3;
    html.classList.toggle('phone-fit', on);
    html.style.setProperty('--fit', on ? ratio.toFixed(3) : '1');
  }
  apply();
  addEventListener('resize', apply);
  addEventListener('orientationchange', function () { setTimeout(apply, 250); });
})();
</script>
