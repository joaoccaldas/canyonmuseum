<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product Intake Proof V0</title><link rel="stylesheet" href="web/styles/features/product-intake-shared.css">
<link rel="stylesheet" href="web/styles/features/product-intake-web.css" media="(min-width:761px) and (pointer:fine)">
<link rel="stylesheet" href="web/styles/features/product-intake-mobile.css" media="(max-width:760px), (pointer:coarse)"></head><body>
<canvas id="proof" aria-label="Test-only product intake rooms"></canvas>
<div class="chrome"><button id="loadCandidates">Load deferred candidates</button>__ROOM_BUTTONS__</div>
<aside id="info" hidden><h2></h2><p data-type></p><p data-claim></p><p><b>Asset</b> <span data-path></span></p><p><b>Capabilities</b> <span data-cap></span></p><p><b>Sources</b> <span data-source></span></p></aside>
<script>
window.__intakeProofReady=false;
window.__intakeProofDiagnostics={stages:[],errors:[],requestFailures:[],timestamps:{},bootAt:performance.now()};
window.__intakeStage=function(name,detail){
  const d=window.__intakeProofDiagnostics;
  d.stages.push(detail==null?name:{name,detail});
  d.timestamps[name]=Math.round(performance.now()-d.bootAt);
};
window.__intakeError=function(kind,value){
  window.__intakeProofDiagnostics.errors.push({kind,message:String(value?.stack||value),at:Math.round(performance.now()-window.__intakeProofDiagnostics.bootAt)});
};
window.__intakeStage('BOOT_HTML');
addEventListener('error',e=>window.__intakeError('window.error',e.error||e.message));
addEventListener('unhandledrejection',e=>window.__intakeError('unhandledrejection',e.reason));
window.__INTAKE_PROOF=__DATA__;
window.__intakeStage('DATA_READY');
</script><script>__APP__</script></body></html>
