name: Build Kona heritage 3D assets

on:
  push:
    branches:
      - assets/kona-environment-pack-20260930
    paths:
      - blender/kona_heritage_nike_assets.py
      - museum/catalog/kona-heritage-nike-assets.json
      - .github/workflows/kona-heritage-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kona-heritage-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Blender Python module
        run: python -m pip install --upgrade pip bpy

      - name: Build GLBs and editable blend source
        run: python blender/kona_heritage_nike_assets.py

      - name: Validate generated asset magic and sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('assets/kona-heritage').rglob('*.glb'))
          assert len(files) == 12, f'expected 12 GLBs (11 assets + pack), got {len(files)}'
          for p in files:
              b = p.read_bytes()
              assert b[:4] == b'glTF', f'invalid GLB magic: {p}'
              assert int.from_bytes(b[8:12], 'little') == len(b), f'GLB length mismatch: {p}'
              limit = 4_000_000 if p.name == 'kona_heritage_nike_pack.glb' else 500_000
              assert len(b) < limit, f'asset unexpectedly heavy for mobile/runtime budget: {p} {len(b)} >= {limit}'
              print(p, len(b))
          blend = Path('assets/kona-heritage/pack/kona_heritage_nike_pack.blend')
          assert blend.exists() and blend.stat().st_size > 0

          import json
          report=json.loads(Path('assets/kona-heritage/build-report.json').read_text())
          for aid,row in report['bikes'].items():
              for key in ('wheelbase','chainstay','bb_drop'):
                  expected=row[f'expected_{key}_m']
                  actual=row[f'actual_{key}_m']
                  assert abs(expected-actual) <= 0.0005, f'{aid} {key} drift: {expected} vs {actual}'
              if 'expected_stack_m' in row:
                  assert abs(row['expected_stack_m']-row['actual_stack_m']) <= 0.0005, f'{aid} stack drift'
              if 'expected_reach_m' in row:
                  assert abs(row['expected_reach_m']-row['actual_reach_m']) <= 0.0005, f'{aid} reach drift'
          print('manufacturer geometry QA passed')
          PY

      - name: Commit generated assets to this asset branch
        run: |
          if [ -z "$(git status --porcelain -- assets/kona-heritage)" ]; then
            echo "Generated assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kona-heritage
          git add -f assets/kona-heritage/pack/kona_heritage_nike_pack.blend
          git commit -m "build: generate Kona heritage and Nike 3D assets [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
