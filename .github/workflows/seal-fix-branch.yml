name: Seal bugfix branch

on:
  push:
    branches: [fix/local-dev-sw-shadow-20260930]
    paths-ignore:
      - 'sw.js'
      - 'app/app-manifest.json'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-dev-sw-shadow-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node tools/build_pages.mjs
      - run: node tools/build_app.mjs
      - name: Commit deterministic build + seal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add museum/catalog/products.json docs/ROOMS.md ./*.html web/dist/*.html sw.js app/app-manifest.json
          if git diff --cached --quiet; then echo "seal already current"; exit 0; fi
          git commit -m "build(app): seal bugfix release"
          git push origin HEAD:fix/local-dev-sw-shadow-20260930
