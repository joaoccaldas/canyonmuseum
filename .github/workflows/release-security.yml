name: Release security gate

on:
  push:
    branches:
      - release/kona-beta-go-live-20260930
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Scan tracked files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files -z | tr '\0' '\n' | grep -Ev '(^|/)(package-lock\.json|.*\.(glb|blend|png|jpe?g|webp|gif|ico|gz|apk|woff2?|ttf|otf|wasm|pdf|mp4|mov|webm|mp3|zip))
          test -n "$files"
          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{15,}|[A-Za-z0-9._%+-]+@(gmail|hotmail|outlook|icloud|yahoo)\.com'
          bad=0
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/release-security.yml|.github/workflows/pages.yml) continue ;;
            esac
            if grep -I --binary-files=without-match -nE "$patterns" "$f" >/tmp/secret_hits 2>/dev/null; then
              echo "::error file=$f::Potential secret/private-data pattern"
              cat /tmp/secret_hits
              bad=1
            fi
          done <<< "$files"
          test "$bad" -eq 0
      - name: Block local machine paths
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '/Users/[^/]+/|/home/[^/]+/' -- ':!*.md' ':!.github/workflows/*'; then
            echo "::error::Local filesystem path committed"; exit 1
          fi

  web-dependencies:
    name: Web dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  android-dependencies:
    name: Android shell dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/native/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app/native
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
        working-directory: app/native
 || true)
          test -n "$files"
          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{15,}|[A-Za-z0-9._%+-]+@(gmail|hotmail|outlook|icloud|yahoo)\.com'
          bad=0
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/release-security.yml|.github/workflows/pages.yml) continue ;;
            esac
            if grep -nE "$patterns" "$f" >/tmp/secret_hits 2>/dev/null; then
              echo "::error file=$f::Potential secret/private-data pattern"
              cat /tmp/secret_hits
              bad=1
            fi
          done <<< "$files"
          test "$bad" -eq 0
      - name: Block local machine paths
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '/Users/[^/]+/|/home/[^/]+/' -- ':!*.md' ':!.github/workflows/*'; then
            echo "::error::Local filesystem path committed"; exit 1
          fi

  web-dependencies:
    name: Web dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  android-dependencies:
    name: Android shell dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
