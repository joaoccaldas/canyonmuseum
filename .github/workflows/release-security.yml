name: Release security gate

on:
  push:
    branches:
      - release/kona-beta-source-rc-20260930
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Scan source for secrets and private data
        shell: bash
        run: |
          set -euo pipefail
          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{15,}|[A-Za-z0-9._%+-]+@(gmail|hotmail|outlook|icloud|yahoo)\.com'
          if git grep -I -nE "$patterns" -- .             ':!.github/workflows/release-security.yml'             ':!*.md' ':!package-lock.json'             ':!*.glb' ':!*.blend' ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp' ':!*.gif' ':!*.ico' ':!*.gz' ':!*.apk'             ':!*.woff' ':!*.woff2' ':!*.ttf' ':!*.otf' ':!*.wasm' ':!*.pdf' ':!*.mp4' ':!*.mov' ':!*.webm' ':!*.mp3' ':!*.zip'             ':!/*.html' ':!/web/dist/*.html' ':!/sw.js' ':!/app/app-manifest.json'; then
            echo "::error::Potential secret/private-data pattern found in source"
            exit 1
          fi
      - name: Block local machine paths
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -nE '/Users/[^/]+/|/home/[^/]+/' -- . ':!*.md' ':!.github/workflows/*' ':!/*.html' ':!/web/dist/*.html'; then
            echo "::error::Local filesystem path committed"
            exit 1
          fi

  web-dependencies:
    name: Web dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  android-dependencies:
    name: Android shell dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/native/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app/native
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
        working-directory: app/native
