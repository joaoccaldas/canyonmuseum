name: Temporary P0 mobile install output sync
on:
  push:
    branches: [p0/mobile-install-responsive-v3-20260930]
    paths-ignore: ['*.html','web/dist/**','sw.js','app/app-manifest.json','docs/ROOMS.md','museum/catalog/products.json']
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: p0/mobile-install-responsive-v3-20260930, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node tools/build_pages.mjs
      - run: node tools/build_app.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add museum/catalog/products.json docs/ROOMS.md ./*.html web/dist/*.html sw.js app/app-manifest.json app/kona-core.js app/museum-data.js app/hall.js app/studio.js app/studio-catalog.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync P0 mobile install outputs [skip ci]"
          git push origin HEAD:p0/mobile-install-responsive-v3-20260930
