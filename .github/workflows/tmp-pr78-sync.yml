name: Temporary PR78 app output sync
on:
  push:
    branches: [design/landing-onboarding-visual-v1-20260930]
    paths-ignore: ['sw.js','app/app-manifest.json','*.html','web/dist/**']
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: design/landing-onboarding-visual-v1-20260930, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node tools/build_pages.mjs
      - run: node tools/build_app.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js app/app-manifest.json ./*.html web/dist/*.html museum/catalog/products.json docs/ROOMS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync PR78 visual release outputs [skip ci]"
          git push origin HEAD:design/landing-onboarding-visual-v1-20260930
