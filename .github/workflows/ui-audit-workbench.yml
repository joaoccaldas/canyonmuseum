name: UI audit workbench
on:
  push:
    branches: [refactor/ui-button-audit-20261001]
    paths: [.github/workflows/ui-audit-workbench.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Package tracked source and locked development dependencies
        run: |
          mkdir -p qa-workbench
          git rev-parse HEAD > qa-workbench/source-sha.txt
          git archive --format=tar HEAD | gzip > qa-workbench/source.tar.gz
          tar -czf qa-workbench/web-dependencies.tar.gz -C web node_modules
          sha256sum qa-workbench/*.tar.gz > qa-workbench/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ui-audit-workbench-${{ github.sha }}
          path: qa-workbench/
          retention-days: 3
