name: Deploy KONA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: canyon-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require certification of this exact source SHA
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['checks.yml','app-seal.yml','release-security.yml','integration-contract.yml','visual-evidence-v2.yml','ui-interaction-audit.yml'];
            for (const workflow_id of required) {
              const {data} = await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id,head_sha:context.sha,per_page:100});
              const run = data.workflow_runs.filter(r=>r.head_sha===context.sha).sort((a,b)=>b.id-a.id)[0];
              if (!run || run.status!=='completed' || run.conclusion!=='success') {
                core.setFailed(`${workflow_id} has no successful completed certification for ${context.sha}`);
                return;
              }
              core.info(`${workflow_id}: ${run.html_url}`);
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Gate (tests + bike asset contract; nothing broken goes live)
        run: |
          (cd web && npm ci --ignore-scripts && npm test)
          node tools/validate-bikes.mjs
          node tools/build_pages.mjs
          node tools/build_app.mjs
          git diff --exit-code -- app sw.js '*.html' web/dist museum/catalog/products.json museum/entry-catalog.json integrations/public-catalog.json

      - name: Stage static site (allowlist — only what the pages load or link)
        run: |
          bash tools/stage_site.sh

      - name: Leak guard (no local paths, private emails, keys or saved third-party pages)
        run: |
          if grep -rIlE '/Users/[a-z]+|/home/[a-z]+/|[A-Za-z0-9._%+-]{1,64}@(gmail|hotmail|outlook|icloud|yahoo)\.com|(^|[^A-Za-z0-9+/])(sk-[A-Za-z0-9]{20,80}|ghp_[A-Za-z0-9]{30,80}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35})([^A-Za-z0-9+/]|$)|demandware|cloudflareinsights' _site; then
            echo "::error::private or third-party content in the published site"; exit 1; fi
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
