name: Deploy KONA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canyon-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Gate (tests + bike asset contract; nothing broken goes live)
        run: |
          (cd web && npm ci --ignore-scripts && npm test)
          node tools/validate-bikes.mjs

      - name: Stage static site (allowlist — only what the pages load or link)
        run: |
          mkdir _site
          printf '{"sha":"%s","ref":"%s","run_id":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/release.json
          cp ./*.html manifest.webmanifest sw.js robots.txt sitemap.xml llms.txt llms-full.txt _site/
          mkdir -p _site/app && cp app/kona-core.js app/museum-data.js app/hall.js app/studio.js app/studio-catalog.js _site/app/
          rsync -a assets/ _site/assets/ --exclude reference/
          mkdir -p _site/assets/reference && rsync -a assets/reference/paintings/ _site/assets/reference/paintings/
          mkdir -p _site/docs && cp docs/FIT_RESEARCH_AND_ROADMAP.md _site/docs/
          test -f _site/release.json
          node -e "const r=require('./_site/release.json'); if(r.sha!==process.env.GITHUB_SHA) process.exit(1)"
          test -f _site/index.html && test -f _site/manifest.webmanifest && test -f _site/sw.js
          test -f _site/app/kona-core.js && test -f _site/app/museum-data.js && test -f _site/app/hall.js && test -f _site/app/studio.js && test -f _site/app/studio-catalog.js

      - name: Leak guard (no local paths, private emails, keys or saved third-party pages)
        run: |
          if grep -rIlE '/Users/[a-z]+|/home/[a-z]+/|[A-Za-z0-9._%+-]{1,64}@(gmail|hotmail|outlook|icloud|yahoo)\.com|(^|[^A-Za-z0-9+/])(sk-[A-Za-z0-9]{20,80}|ghp_[A-Za-z0-9]{30,80}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35})([^A-Za-z0-9+/]|$)|demandware|cloudflareinsights' _site; then
            echo "::error::private or third-party content in the published site"; exit 1; fi
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
