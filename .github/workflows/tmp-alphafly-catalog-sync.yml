name: Temporary Alphafly catalog sync
on:
  push:
    branches: [product/alphafly-canonical-slice-v1-20260930]
    paths-ignore: [integrations/public-catalog.json]
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: product/alphafly-canonical-slice-v1-20260930, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/build_public_catalog.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/public-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync public catalog for Alphafly [skip ci]"
          git push origin HEAD:product/alphafly-canonical-slice-v1-20260930
