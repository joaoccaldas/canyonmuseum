name: Build growth branch

on:
  push:
    branches: [feat/growth-seo-i18n-progression-20260930]
    paths-ignore:
      - 'sw.js'
      - 'app/app-manifest.json'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'docs/ROOMS.md'
      - 'index.html'
      - 'Studio.html'
      - 'Experiences.html'
      - 'Canyon_Collection.html'
      - 'Speedmax_*_Museum.html'
      - 'web/dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/growth-seo-i18n-progression-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node tools/build_pages.mjs
      - run: node tools/build_app.mjs
      - run: npm test
        working-directory: web
      - run: node tools/validate-bikes.mjs
      - name: Commit generated growth artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add museum/catalog/products.json docs/ROOMS.md ./*.html web/dist/*.html sw.js app/app-manifest.json robots.txt sitemap.xml llms.txt llms-full.txt
          if git diff --cached --quiet; then echo "generated outputs current"; exit 0; fi
          git commit -m "build(app): regenerate growth branch artifacts"
          git push origin HEAD:feat/growth-seo-i18n-progression-20260930
