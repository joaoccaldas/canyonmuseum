name: Museum checks

# Every push and pull request: unit tests, the bike asset contract, and a rebuild that must match
# what is committed. The Pages deploy runs the same gate before it publishes (pages.yml).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Bike asset contract
        run: node tools/validate-bikes.mjs
      - name: Repository hygiene
        run: node tools/repo-hygiene.mjs
      - name: Built pages are up to date
        run: |
          node tools/build_pages.mjs
          git diff --stat --exit-code -- museum/catalog/products.json docs/ROOMS.md '*.html' 'web/dist/*.html' \
            || { echo "::error::built pages are stale: run node tools/build_pages.mjs and commit"; exit 1; }
